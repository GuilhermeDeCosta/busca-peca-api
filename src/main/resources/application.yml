# Configuracao comum aos perfis dev e prod
server:
  port: 8080
  servlet:
    context-path: /api            # todas as rotas ficam em /api/... (Documentacao do Back-end v2)

spring:
  application:
    name: buscapeca-backend
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # o esquema e criado so pelo Flyway
    properties:
      hibernate.jdbc.time_zone: America/Sao_Paulo
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      admin_email: ${ADMIN_EMAIL:admin@buscapeca.com.br}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB
  jackson:
    time-zone: America/Sao_Paulo

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    csrf:
      enabled: true               # o Swagger envia o X-XSRF-TOKEN sozinho
    with-credentials: true

app:
  jwt:
    segredo: ${JWT_SEGREDO}
    expiracao-minutos: ${JWT_EXPIRACAO_MINUTOS:120}
  admin:
    email: ${ADMIN_EMAIL:admin@buscapeca.com.br}
    senha: ${ADMIN_SENHA:}
