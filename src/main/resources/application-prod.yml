# Perfil de producao: tudo vem de variaveis de ambiente
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USUARIO}
    password: ${DB_SENHA}
  jpa:
    show-sql: false
  mail:
    host: ${EMAIL_HOST}
    username: ${EMAIL_USUARIO}
    password: ${EMAIL_SENHA}

app:
  front-origem: ${FRONT_ORIGEM}
  cookie-secure: true
  cookie-dominio: ${COOKIE_DOMINIO}
  upload-diretorio: ${UPLOAD_DIRETORIO}