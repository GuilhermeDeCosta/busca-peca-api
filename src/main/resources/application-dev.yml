# Perfil de desenvolvimento local (MySQL do docker-compose.yml ou instalado no Windows)
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/buscapeca?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
    username: ${DB_USUARIO:buscapeca}
    password: ${DB_SENHA:buscapeca}
  jpa:
    show-sql: true
    properties:
      hibernate.format_sql: true
  flyway:
    # db/dev tem veiculos e tags de teste; nunca roda em producao
    locations: classpath:db/migration,classpath:db/dev

app:
  front-origem: ${FRONT_ORIGEM:http://localhost:5500}
  cookie-secure: false
  upload-diretorio: ${UPLOAD_DIRETORIO:./uploads}
  jwt:
    # Chave so de desenvolvimento. Em producao, JWT_SEGREDO e obrigatoria.
    segredo: ${JWT_SEGREDO:dev-chave-local-buscapeca-troque-em-producao-0123456789}
  admin:
    # Senha so de desenvolvimento do administrador inicial (admin@buscapeca.com.br)
    senha: ${ADMIN_SENHA:Admin@123}
